name: prehistoric-v7
on:
  push:
    branches: [experiment/prehistoric-personality-lab]
    paths:
      - 'experiments/prehistoric-society-v3-*.js'
      - 'experiments/prehistoric-singularity-v4.js'
      - 'experiments/prehistoric-cooperation-v4.js'
      - 'experiments/prehistoric-late-paleolithic-v5.js'
      - 'experiments/prehistoric-exposure-v6.js'
      - 'experiments/prehistoric-ritual-observer-v6.js'
      - 'experiments/prehistoric-primitive-bridge-v7.js'
      - 'experiments/archaeology-anchors-v6.json'
      - 'experiments/prehistoric-headless-v7.mjs'
      - 'experiments/prehistoric-personality-lab-v7.html'
      - '.github/workflows/prehistoric-v4.yml'
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run primitive late Paleolithic simulation
        run: node experiments/prehistoric-headless-v7.mjs | tee prehistoric-v7-result.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: prehistoric-v7-result
          path: prehistoric-v7-result.json
