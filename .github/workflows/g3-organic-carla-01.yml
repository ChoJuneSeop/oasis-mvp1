name: G3 Organic CARLA 01 Preflight

on:
  push:
    branches:
      - experiment/g3-organic-carla-01
  pull_request:
    branches:
      - integration/oasis-g3-organic-flow-v1

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile independent experiment package
        run: python -m compileall -q research/g3_organic_carla_01

      - name: Verify frozen experiment source manifest
        run: >-
          python -c "from research.g3_organic_carla_01.frozen_runner import verify_experiment_manifest; m=verify_experiment_manifest(); print('EXPERIMENT_MANIFEST_VERIFY=PASS'); print('experiment_source_snapshot_commit=' + m['experiment_source_snapshot_commit']); print('preregistration_sha256=' + m['preregistration_sha256'])"

      - name: Print experiment source SHA256
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = [
              Path('research/g3_organic_carla_01/G3_ORGANIC_CARLA_01_PREREGISTRATION.json'),
              Path('research/g3_organic_carla_01/__init__.py'),
              Path('research/g3_organic_carla_01/protocol.py'),
              Path('research/g3_organic_carla_01/run_audit.py'),
              Path('research/g3_organic_carla_01/live_runner.py'),
              Path('research/g3_organic_carla_01/frozen_runner.py'),
              Path('research/g3_organic_carla_01/test_live_runner.py'),
          ]
          print('EXPERIMENT_SHA256=' + json.dumps({
              p.as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in files
          }, sort_keys=True))
          PY

      - name: Independent experiment tests
        run: python -m unittest research.g3_organic_carla_01.test_live_runner -v

      - name: Compile host orchestrator
        run: python -m compileall -q host_tools/g3_organic_carla_01

      - name: Verify host orchestrator manifest
        run: >-
          python -c "from pathlib import Path; from host_tools.g3_organic_carla_01.windows_orchestrator import verify_host_manifest; verify_host_manifest(Path('host_tools/g3_organic_carla_01')); print('HOST_ORCHESTRATOR_MANIFEST_VERIFY=PASS')"

      - name: Host orchestrator regression
        run: python -m unittest host_tools.g3_organic_carla_01.test_windows_orchestrator -v

      - name: Verify low-VRAM host manifest
        run: >-
          python -c "from pathlib import Path; from host_tools.g3_organic_carla_01.windows_orchestrator_low_vram import verify_low_vram_manifest; verify_low_vram_manifest(Path('host_tools/g3_organic_carla_01')); print('LOW_VRAM_HOST_MANIFEST_VERIFY=PASS')"

      - name: Low-VRAM host regression
        run: python -m unittest host_tools.g3_organic_carla_01.test_low_vram_orchestrator -v

      - name: Verify staged 5-second host manifest
        run: >-
          python -c "from pathlib import Path; from host_tools.g3_organic_carla_01.windows_orchestrator_staged import verify_staged_manifest; verify_staged_manifest(Path('host_tools/g3_organic_carla_01')); print('STAGED_5S_HOST_MANIFEST_VERIFY=PASS')"

      - name: Staged 5-second host regression
        run: python -m unittest host_tools.g3_organic_carla_01.test_staged_orchestrator -v

      - name: Organic integration regression
        run: >-
          python -m unittest
          research.g3_organic_flow_v1.test_organic_flow
          research.g3_organic_flow_v1.test_shared_closure
          research.g3_organic_flow_v1.test_carla_atomic_port
          research.g3_organic_flow_v1.test_runtime_freeze
          -v

      - name: Frozen G3.2 sidecar regression
        run: python -m unittest discover -s research/g3_2_sidecar -p 'test_*.py' -v

      - name: Frozen OASIS Core v1.1 regression
        run: python -m unittest discover -s research/oasis_core_v11 -p 'test_*.py' -v

      - name: Frozen OASIS Core v1.2 regression
        run: python -m unittest research.oasis_core_v12.test_supplement -v

      - name: Frozen choice responsibility regression
        run: python -m unittest research.choice_responsibility_v01.test_integration -v

      - name: Frozen final integration regression
        run: python -m unittest research.integration_checkpoint.test_cross research.integration_checkpoint.test_harness_adapter -v

      - name: Frozen canonical CARLA harness regression
        run: python -m unittest discover -s research/carla_v22_harness_v11 -p 'test_*.py' -v
