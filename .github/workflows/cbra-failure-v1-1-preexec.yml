name: CBRA failure v1.1 preexecution

on:
  push:
    branches: [feature/governance-cbra-failure-v1-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m compileall -q research/governance_cbra_v1 research/governance_cbra_failure_exp_v1
      - name: CBRA invariants
        run: python -m unittest -v research.governance_cbra_v1.validation.test_axis
      - name: Failure experiment preexecution
        run: python -m unittest -v research.governance_cbra_failure_exp_v1.test_preexec
      - name: Governance regression
        run: python -m unittest -v research.governance_harness_v01.test_governance_attack_v04
