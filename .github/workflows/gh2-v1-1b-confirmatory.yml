name: GH-2 v1.1b Confirmatory

on:
  push:
    branches:
      - experiment/governance-harness-gh2-v1-1b-confirmatory
  workflow_dispatch:

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen experiment snapshot
        uses: actions/checkout@v4
        with:
          ref: 6d1a6606c0dc06074832474d2b29fe1140e5f0bd
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact snapshot
        run: |
          test "$(git rev-parse HEAD)" = "6d1a6606c0dc06074832474d2b29fe1140e5f0bd"

      - name: Run frozen 66-frame confirmatory matrix
        env:
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          PILOT_RUN_ID: '35077799681'
          PILOT_RAW_SHA256: '68aee32922e13bb59df0149b85a5a515eca1075671e15a271915b09110484e8f'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          from research.governance_harness_gh2.models import ARMS, FORBIDDEN_RUNTIME_KEYS
          from research.governance_harness_gh2.runner import run_runtime
          from research.governance_harness_gh2.scenario import build_confirmatory_world

          SNAPSHOT = "6d1a6606c0dc06074832474d2b29fe1140e5f0bd"
          cases = build_confirmatory_world()
          assert len(cases) == 66, len(cases)
          assert len({c.runtime.frame_id for c in cases}) == 66
          assert len({c.truth.pair_id for c in cases}) == 33
          assert not any(FORBIDDEN_RUNTIME_KEYS.intersection(c.runtime.__dict__) for c in cases)

          # Workers receive RuntimeFrame only. Evaluator truth is joined only after all four workers return.
          runtime = tuple(c.runtime for c in cases)
          result = run_runtime(runtime)
          workers = result["workers"]
          assert len(workers) == len(ARMS) == 4
          assert {w["arm"] for w in workers} == set(ARMS)
          assert len({w["pid"] for w in workers}) == 4
          assert len({w["worker_token"] for w in workers}) == 4

          by_arm_worker = {w["arm"]: w for w in workers}
          for w in workers:
              assert w["decision_count"] == 66
              assert w["realization_count"] == 66
              for d in w["decisions"]:
                  assert d["candidate_ids"] == ["continue-flow", "yield-space"]
                  assert d["enacted_selected"] in d["candidate_ids"]
                  assert d["enacted_selected"] == d["realized_action"]
                  assert d["realization_count"] == 1
                  assert d["responsibility"]["selected_obligations"]
                  assert d["responsibility"]["nonselected_obligations"]
                  assert "score" not in d["responsibility"]
                  for p in d["responsibility"]["profiles"]:
                      assert "score" not in p

          for idx in range(66):
              candidate_sets = {tuple(by_arm_worker[a]["decisions"][idx]["candidate_ids"]) for a in ARMS}
              assert candidate_sets == {("continue-flow", "yield-space")}

          for d in by_arm_worker["R1_CURRENT_BOUND"]["decisions"]:
              assert d["responsibility_bound"] is True
              assert d["responsibility"]["source"] == "current"
              assert d["responsibility"]["responsibility_selected"] == d["enacted_selected"]

          assert all(d["responsibility_bound"] is False for d in by_arm_worker["R2_RECORD_ONLY"]["decisions"])
          assert all(d["responsibility"]["source"] == "permuted" for d in by_arm_worker["R3_PERMUTED"]["decisions"])

          r4 = by_arm_worker["R4_STALE"]["decisions"]
          for idx, d in enumerate(r4):
              if idx % 2 == 0:
                  assert d["stale_source_frame_id"] is None, (idx, d["frame_id"], d["stale_source_frame_id"])
              else:
                  assert d["stale_source_frame_id"] == r4[idx - 1]["frame_id"], (idx, d)

          truth = {c.runtime.frame_id: c.truth for c in cases}
          meta = {
              c.runtime.frame_id: {
                  "scenario_class": c.truth.scenario_class,
                  "expected_action": c.truth.expected_action,
                  "pair_id": c.truth.pair_id,
                  "family": c.truth.pair_id.split("-")[1],
              }
              for c in cases
          }

          metrics = {}
          resolved_vectors = {}
          for arm in ARMS:
              decisions = by_arm_worker[arm]["decisions"]
              resolved = [int(d["realized_action"] == truth[d["frame_id"]].expected_action) for d in decisions]
              resolved_vectors[arm] = resolved
              count = sum(resolved)
              metrics[arm] = {
                  "resolved_count": count,
                  "unresolved_count": 66 - count,
                  "resolution_rate": count / 66.0,
                  "invalid_count": 0,
              }

          r1 = metrics["R1_CURRENT_BOUND"]["resolution_rate"]
          r2 = metrics["R2_RECORD_ONLY"]["resolution_rate"]
          r3 = metrics["R3_PERMUTED"]["resolution_rate"]
          r4m = metrics["R4_STALE"]["resolution_rate"]

          r1_decisions = by_arm_worker["R1_CURRENT_BOUND"]["decisions"]
          r2_decisions = by_arm_worker["R2_RECORD_ONLY"]["decisions"]
          changed = sum(a["enacted_selected"] != b["enacted_selected"] for a, b in zip(r1_decisions, r2_decisions))

          family_breakdown = {}
          for family in ("F1", "F2", "F3"):
              ids = [i for i, c in enumerate(cases) if meta[c.runtime.frame_id]["family"] == family]
              family_breakdown[family] = {}
              for arm in ARMS:
                  vals = [resolved_vectors[arm][i] for i in ids]
                  family_breakdown[family][arm] = {
                      "resolved_count": sum(vals),
                      "frame_count": len(vals),
                      "resolution_rate": sum(vals) / len(vals),
                  }

          combo_breakdown = defaultdict(dict)
          for i, c in enumerate(cases):
              combo = c.truth.scenario_class.split("-")[0]
              for arm in ARMS:
                  combo_breakdown[combo].setdefault(arm, {"resolved_count": 0, "frame_count": 0})
                  combo_breakdown[combo][arm]["resolved_count"] += resolved_vectors[arm][i]
                  combo_breakdown[combo][arm]["frame_count"] += 1
          for combo in combo_breakdown:
              for arm in ARMS:
                  item = combo_breakdown[combo][arm]
                  item["resolution_rate"] = item["resolved_count"] / item["frame_count"]

          payload = {
              "experiment": "GH-2",
              "version": "v1.1",
              "stage": "CONFIRMATORY",
              "status": "COMPLETE",
              "experiment_snapshot_sha": SNAPSHOT,
              "workflow_head_sha": os.environ.get("WORKFLOW_HEAD_SHA"),
              "pilot_provenance": {
                  "run_id": int(os.environ["PILOT_RUN_ID"]),
                  "raw_result_sha256": os.environ["PILOT_RAW_SHA256"],
                  "used_for_sample_size": False,
                  "used_for_hypothesis": False,
              },
              "confirmatory_design": {
                  "frame_count_per_arm": 66,
                  "arm_count": 4,
                  "total_decision_realization_units": 264,
                  "matched_pairs": 33,
                  "observation_families": 3,
                  "pilot_scenarios_reused": False,
              },
              "structural_invariants": {
                  "fresh_process": True,
                  "candidate_sets_identical": True,
                  "selected_equals_realized": True,
                  "one_realization_per_decision": True,
                  "responsibility_non_scalar": True,
                  "r1_bound_to_current_responsibility": True,
                  "r4_pair_local_stale": True,
                  "evaluator_joined_post_worker": True,
                  "runtime_evaluator_leakage": False,
              },
              "metrics": metrics,
              "contrasts": {
                  "primary_R1_minus_R2": r1 - r2,
                  "secondary_R1_minus_R3": r1 - r3,
                  "secondary_R1_minus_R4": r1 - r4m,
                  "R1_vs_R2_selection_change_count": changed,
                  "R1_vs_R2_selection_change_rate": changed / 66.0,
              },
              "family_breakdown": family_breakdown,
              "combo_breakdown": dict(combo_breakdown),
              "aggregate_score": None,
              "raw_workers": workers,
          }

          out = Path("gh2_v11_confirmatory_result.json")
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path("gh2_v11_confirmatory_sha256.txt").write_text(digest + "  " + out.name + "\n", encoding="utf-8")
          print(json.dumps({
              "status": "COMPLETE",
              "sha256": digest,
              "metrics": metrics,
              "contrasts": payload["contrasts"],
              "total_units": 264,
          }, indent=2))
          PY

      - name: Validate confirmatory result contract
        run: |
          python - <<'PY'
          import json
          p = json.load(open('gh2_v11_confirmatory_result.json', encoding='utf-8'))
          assert p['status'] == 'COMPLETE'
          assert p['experiment_snapshot_sha'] == '6d1a6606c0dc06074832474d2b29fe1140e5f0bd'
          assert p['confirmatory_design']['total_decision_realization_units'] == 264
          assert p['aggregate_score'] is None
          for key, value in p['structural_invariants'].items():
              if key == 'runtime_evaluator_leakage':
                  assert value is False
              else:
                  assert value is True, (key, value)
          assert p['pilot_provenance']['used_for_sample_size'] is False
          assert p['pilot_provenance']['used_for_hypothesis'] is False
          PY

      - name: Upload confirmatory evidence
        uses: actions/upload-artifact@v4
        with:
          name: gh2-v1-1-confirmatory
          path: |
            gh2_v11_confirmatory_result.json
            gh2_v11_confirmatory_sha256.txt
