name: OASIS Mathematical Kernel v1 Canonical Audit

on:
  push:
    branches:
      - storage/oasis-integrated-research-system-v1.0
    paths:
      - 'integrated-research-system-storage/executable/**'
      - '.github/workflows/oasis-math-kernel-v1-canonical.yml'
  workflow_dispatch:

jobs:
  canonical-reference-kernel-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check base infrastructure
        run: node --check integrated-research-system-storage/executable/src/oasis-math-kernel-v1.mjs
      - name: Syntax check canonical entrypoint
        run: node --check integrated-research-system-storage/executable/src/oasis-math-kernel-v1-canonical.mjs
      - name: Run all operator reference tests
        run: node --test integrated-research-system-storage/executable/tests/*.test.mjs
