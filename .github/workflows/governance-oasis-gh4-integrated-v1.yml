name: Governance OASIS GH4 Integrated Confirmatory v1

on:
  push:
    branches:
      - experiment/governance-oasis-gh4-integrated-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gh4-integrated-confirmatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile GH4 package
        run: python -m compileall -q research/governance_oasis_gh4_integrated_v1
      - name: Frozen scientific harness integrity
        run: python -m unittest -v research.governance_oasis_scientific_proof_harness_v1.test_freeze_integrity
      - name: GH4 integrated preregistration and structural tests
        run: python -m unittest -v research.governance_oasis_gh4_integrated_v1.test_gh4
      - name: GH4 explicit integrated preflight
        run: python -m research.governance_oasis_gh4_integrated_v1.preflight
      - name: GH4 integrated confirmatory execution
        run: |
          mkdir -p gh4-artifacts
          python -m research.governance_oasis_gh4_integrated_v1.orchestrator --stage confirmatory | tee gh4-artifacts/GH4-INTEGRATED-CONFIRMATORY.json
      - name: Upload sealed GH4 integrated output
        uses: actions/upload-artifact@v4
        with:
          name: governance-oasis-gh4-integrated-${{ github.run_id }}-${{ github.run_attempt }}
          path: gh4-artifacts/GH4-INTEGRATED-CONFIRMATORY.json
          if-no-files-found: error
          retention-days: 90
