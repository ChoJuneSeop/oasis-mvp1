name: CBRA failure v1 Confirmatory

on:
  push:
    branches: [experiment/cbra-failure-v1-confirmatory]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 067bf002296f7eb524d99337c66fc28703543226
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen snapshot
        run: test "$(git rev-parse HEAD)" = "067bf002296f7eb524d99337c66fc28703543226"
      - name: Run Confirmatory
        run: python -m research.governance_cbra_failure_exp_v1.runner --stage confirmatory > cbra_failure_v1_confirmatory.json
      - name: Validate frozen output contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open("cbra_failure_v1_confirmatory.json"))
          assert x["stage"]=="confirmatory"
          assert x["scientific_evaluator_used"] is True
          assert x["aggregate_score"] is None
          s=x["structural"]
          assert s["fresh_process"]
          assert s["arm_count"]==3
          assert s["case_count_per_arm"]==60
          assert s["checkpoint_exactly_one"]
          assert s["as_of_gate_exactly_one"]
          assert s["counterfactual_claimed"] is False
          assert set(x["metrics"])=={"GOV_CBRA","GOV_RECORD_ONLY","GENERAL_HARNESS"}
          assert x["truth_case_count"]==60
          PY
      - name: Hash Confirmatory evidence
        run: sha256sum cbra_failure_v1_confirmatory.json > cbra_failure_v1_confirmatory.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cbra-failure-v1-confirmatory
          path: |
            cbra_failure_v1_confirmatory.json
            cbra_failure_v1_confirmatory.sha256
