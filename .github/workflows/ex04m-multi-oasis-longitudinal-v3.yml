name: OASIS EX-04M Multi-OASIS Longitudinal v3

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/ex04m-multi-oasis-longitudinal-v3.mjs"
      - "relation-field.js"
      - "index.html"
      - "tools/validation-compatibility-guard.mjs"
      - ".github/workflows/ex04m-multi-oasis-longitudinal-v3.yml"

concurrency:
  group: oasis-ex04m-multi-oasis-longitudinal-v3
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run EX-04M multi-OASIS longitudinal comparison
        run: node tools/ex04m-multi-oasis-longitudinal-v3.mjs
      - name: Upload EX-04M evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-ex04m-multi-oasis-longitudinal-v3
          path: ex04m-multi-oasis-longitudinal-v3-report.json
          if-no-files-found: ignore
