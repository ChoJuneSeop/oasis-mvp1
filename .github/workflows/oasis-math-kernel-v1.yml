name: OASIS Mathematical Kernel v1 Audit

on:
  push:
    branches:
      - storage/oasis-integrated-research-system-v1.0
    paths:
      - 'integrated-research-system-storage/executable/**'
      - '.github/workflows/oasis-math-kernel-v1.yml'
  workflow_dispatch:

jobs:
  reference-kernel-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check integrated-research-system-storage/executable/src/oasis-math-kernel-v1.mjs
      - name: Run reference operator tests
        run: node --test integrated-research-system-storage/executable/tests/oasis-math-kernel-v1.test.mjs
