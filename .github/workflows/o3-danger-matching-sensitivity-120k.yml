name: OASIS O3 Danger Matching Sensitivity 120k

on:
  push:
    paths:
      - 'tools/o3-danger-matching-sensitivity-120k.mjs'
      - '.github/workflows/o3-danger-matching-sensitivity-120k.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run 120k matching sensitivity analysis
        run: node tools/o3-danger-matching-sensitivity-120k.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-o3-danger-matching-sensitivity-120k
          path: o3-danger-matching-sensitivity-120k-report.json
          if-no-files-found: ignore
