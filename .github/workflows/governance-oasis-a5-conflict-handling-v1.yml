name: Governance OASIS A5 Conflict Handling v1

on:
  push:
    branches:
      - experiment/governance-oasis-a5-conflict-handling-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a5-confirmatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile A5 package
        run: python -m compileall -q research/governance_oasis_a5_conflict_handling_v1
      - name: Frozen scientific harness integrity
        run: python -m unittest -v research.governance_oasis_scientific_proof_harness_v1.test_freeze_integrity
      - name: A5 preregistration and structural checks
        run: python -m unittest -v research.governance_oasis_a5_conflict_handling_v1.test_a5
      - name: A5 explicit preflight
        run: python -m research.governance_oasis_a5_conflict_handling_v1.preflight
      - name: A5 confirmatory execution
        run: |
          mkdir -p a5-artifacts
          python -m research.governance_oasis_a5_conflict_handling_v1.runner --stage confirmatory | tee a5-artifacts/A5-CONFIRMATORY.json
      - name: Upload sealed A5 output
        uses: actions/upload-artifact@v4
        with:
          name: governance-oasis-a5-confirmatory-${{ github.run_id }}-${{ github.run_attempt }}
          path: a5-artifacts/A5-CONFIRMATORY.json
          if-no-files-found: error
          retention-days: 90
