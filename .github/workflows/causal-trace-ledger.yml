name: OASIS Causal Research System v3 Validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "relation-field.js"
      - "tools/latent-relation-store-validation.mjs"
      - "tools/causal-trace-ledger-v2-safe.mjs"
      - "tools/causal-trace-ledger-v3.mjs"
      - "tools/h1-structural-incorporation-v3.mjs"
      - "tools/h2-integrated-structure-v3.mjs"
      - "tools/validation-compatibility-guard.mjs"
      - "OASIS_RESEARCH_PROTOCOL.md"
      - "docs/OASIS_CAUSAL_RESEARCH_SYSTEM_v3.0_ko.md"
      - "docs/causal/CAUSAL_RESEARCH_SYSTEM_SPEC_v3.0.md"
      - "docs/causal/CAUSAL_EVIDENCE_LEDGER_v3.0.md"
      - "docs/causal/CAUSAL_EXPERIMENT_INDEX_v3.0.md"
      - "docs/CAUSAL_RESEARCH_CURRENT.md"
      - ".github/workflows/causal-trace-ledger.yml"

concurrency:
  group: oasis-causal-research-v3
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Produce fixed 120k latent audit
        run: node tools/latent-relation-store-validation.mjs
      - name: Assemble scale-safe inherited v2 causal traces
        run: node tools/causal-trace-ledger-v2-safe.mjs
      - name: Analyze H1 exact structural incorporation genealogy
        run: node tools/h1-structural-incorporation-v3.mjs
      - name: Analyze H2 integrated downstream structural genealogy
        run: node tools/h2-integrated-structure-v3.mjs
      - name: Assemble v3 behavioral causal evidence
        run: node tools/causal-trace-ledger-v3.mjs
      - name: Upload causal v3 research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-causal-research-v3
          path: |
            latent-relation-store-validation-report.json
            latent-relation-store-audit.jsonl
            latent-relation-store-counterfactual.jsonl
            causal-trace-ledger-v2-report.json
            causal-v2-traces.jsonl
            h1-structural-incorporation-v3-report.json
            h2-integrated-structure-v3-report.json
            causal-trace-ledger-v3-report.json
          if-no-files-found: ignore
