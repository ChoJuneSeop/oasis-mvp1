name: OASIS Causal Research System v1 Validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "relation-field.js"
      - "tools/latent-relation-store-validation.mjs"
      - "tools/causal-trace-ledger-v1.mjs"
      - "tools/validation-compatibility-guard.mjs"
      - "docs/OASIS_CAUSAL_RESEARCH_SYSTEM_v1.0_ko.md"
      - "docs/causal/CAUSAL_RESEARCH_SYSTEM_SPEC_v1.0.md"
      - ".github/workflows/causal-trace-ledger.yml"

concurrency:
  group: oasis-causal-research-v1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Produce fixed 120k latent audit
        run: node tools/latent-relation-store-validation.mjs
      - name: Assemble OASIS v1 causal traces
        run: node tools/causal-trace-ledger-v1.mjs
      - name: Upload causal v1 research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-causal-research-v1
          path: |
            latent-relation-store-validation-report.json
            latent-relation-store-audit.jsonl
            latent-relation-store-counterfactual.jsonl
            causal-trace-ledger-v1-report.json
            causal-v1-traces.jsonl
          if-no-files-found: ignore
