name: OASIS Prehistoric Civilization Experiment v1 [SUPERSEDED]

# v1 is retained only for audit reproducibility.
# It is not automatically re-run because the first execution exposed
# ordered maxPrimitive truncation that starved later capability families.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax audit
        run: |
          node --check integrated-research-system-storage/prehistoric/src/prehistoric-clean-world-v1.mjs
          node --check integrated-research-system-storage/prehistoric/src/prehistoric-civilization-observer-v1.mjs
          node --check integrated-research-system-storage/prehistoric/src/prehistoric-experiment-v1.mjs
      - name: Reproduce superseded v1 only on explicit dispatch
        env:
          OASIS_RUN_SEED: prehistoric-civilization-v1-run0
          OASIS_MAX_CYCLES: '800'
        run: node integrated-research-system-storage/prehistoric/src/prehistoric-experiment-v1.mjs
