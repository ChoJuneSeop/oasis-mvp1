name: Stage32 Asymmetry Diagnostic

on:
  push:
    branches: ["mvp3-reality-flow-kill"]
    paths:
      - "tools/reality-flow-stage32-asymmetry-diagnostic.mjs"
      - ".github/workflows/stage32-asymmetry-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Stage32 asymmetry diagnostic
        run: node tools/reality-flow-stage32-asymmetry-diagnostic.mjs
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage32-asymmetry-diagnostic-report
          path: reality-flow-stage32-asymmetry-diagnostic-report.json
          if-no-files-found: ignore
