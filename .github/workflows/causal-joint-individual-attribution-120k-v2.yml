name: OASIS CR-02 Joint Individual Causal Attribution 120k v2

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/causal-joint-individual-attribution-120k.mjs"
      - "tools/causal-joint-individual-attribution-120k-v2.mjs"
      - "tools/validation-compatibility-guard.mjs"
      - ".github/workflows/causal-joint-individual-attribution-120k-v2.yml"

concurrency:
  group: oasis-cr02-joint-individual-120k-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run CR-02 v2 same-current joint/individual attribution
        run: node tools/causal-joint-individual-attribution-120k-v2.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-cr02-joint-individual-attribution-120k-v2
          path: causal-joint-individual-attribution-120k-report.json
          if-no-files-found: ignore
