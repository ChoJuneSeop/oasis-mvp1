name: OASIS Second Generation Key Ablation

on:
  push:
    branches: ["main"]
    paths:
      - "tools/trace-second-generation-key-ablation.mjs"
      - "tools/trace-second-generation-reactivation.mjs"
      - ".github/workflows/trace-second-generation-key-ablation.yml"
      - "tools/validation-compatibility-guard.mjs"
      - "relation-field.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run key-level relation ablation
        run: node tools/trace-second-generation-key-ablation.mjs
      - name: Upload key-ablation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-second-generation-key-ablation-report
          path: second-generation-key-ablation-report.json
          if-no-files-found: ignore
