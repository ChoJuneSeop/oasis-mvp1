name: Integrate Past Relational Structure v1 into production entry

on:
  push:
    branches:
      - past-relational-structure-fix-v1-run

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify or patch production entry and remove test-only injection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="s.src='./relation-field.js';s.onload=resolve;s.onerror=()=>reject(new Error('relation-field.js load failed'));document.body.appendChild(s)})"
          new="s.src='./relation-field.js';s.onload=()=>{const p=document.createElement('script');p.src='./past-relational-structure-v1.js';p.onload=resolve;p.onerror=()=>reject(new Error('past-relational-structure-v1.js load failed'));document.body.appendChild(p)};s.onerror=()=>reject(new Error('relation-field.js load failed'));document.body.appendChild(s)})"
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          elif new not in s:
              raise SystemExit('production loader is neither original nor integrated')

          for fn in [
              'tools/past-relational-structure-code-contract-v1.mjs',
              'tools/past-relational-structure-exhaustive-audit-v2.mjs'
          ]:
              q=Path(fn)
              t=q.read_text(encoding='utf-8')
              injection="  await page.addScriptTag({url:`http://127.0.0.1:${PORT}/past-relational-structure-v1.js`});\n"
              if injection in t:
                  q.write_text(t.replace(injection,'',1),encoding='utf-8')
          PY
      - name: Commit only if integration changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/past-relational-structure-code-contract-v1.mjs tools/past-relational-structure-exhaustive-audit-v2.mjs
          if git diff --cached --quiet; then
            echo "Production path already integrated; no commit required."
          else
            git commit -m "Load Past Relational Structure in production path"
            git push origin HEAD:past-relational-structure-fix-v1-run
          fi
