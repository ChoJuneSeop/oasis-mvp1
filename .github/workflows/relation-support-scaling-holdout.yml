name: OASIS Relation Support Scaling Holdout

on:
  push:
    branches: ["validation/relation-support-scaling-holdout"]
    paths:
      - "tools/relation-support-scaling-holdout-test.mjs"
      - ".github/workflows/relation-support-scaling-holdout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support-scaling-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run frozen support scaling holdout
        run: node tools/relation-support-scaling-holdout-test.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relation-support-scaling-holdout-report
          path: relation-support-scaling-holdout-report.json
          if-no-files-found: ignore
