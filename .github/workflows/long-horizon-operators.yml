name: OASIS Auxiliary Synthetic Long Horizon Operators

on:
  push:
    branches: ["main"]
    paths:
      - "tools/long-horizon-operator-test.mjs"
      - "tools/o1-order-long-horizon-paired-test.mjs"
      - "tools/validation-compatibility-guard.mjs"
      - "relation-field.js"
      - "tools/browser-world-test.mjs"
      - "tools/open-possibility-flow-test.mjs"
      - ".github/workflows/long-horizon-operators.yml"
  workflow_dispatch:

concurrency:
  group: oasis-auxiliary-long-horizon-operators
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility-and-auxiliary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard canonical validation assumptions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run auxiliary synthetic 1M-tick O1-O4 feasibility validation
        run: node tools/long-horizon-operator-test.mjs
      - name: Run auxiliary synthetic paired 1M-step O1 order-history validation
        run: node tools/o1-order-long-horizon-paired-test.mjs
      - name: Upload auxiliary long-horizon report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-auxiliary-long-horizon-operator-report
          path: long-horizon-operator-report.json
          if-no-files-found: ignore
