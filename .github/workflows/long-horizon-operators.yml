name: OASIS Long Horizon Operator Validation

on:
  push:
    branches: ["main"]
    paths:
      - "tools/long-horizon-operator-test.mjs"
      - ".github/workflows/long-horizon-operators.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-horizon-operators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run 1M-tick O1-O4 long-horizon validation
        run: node tools/long-horizon-operator-test.mjs
      - name: Upload long-horizon report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-long-horizon-operator-report
          path: long-horizon-operator-report.json
          if-no-files-found: ignore
