name: OASIS CR-03C Decision Channel Equivalence 120k

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/causal-decision-channel-equivalence-120k.mjs"
      - "tools/validation-compatibility-guard.mjs"
      - ".github/workflows/causal-decision-channel-equivalence-120k.yml"

concurrency:
  group: oasis-cr03c-channel-equivalence-120k
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run CR-03C decision-channel equivalence
        run: node tools/causal-decision-channel-equivalence-120k.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-cr03c-decision-channel-equivalence-120k
          path: causal-decision-channel-equivalence-120k-report.json
          if-no-files-found: ignore
