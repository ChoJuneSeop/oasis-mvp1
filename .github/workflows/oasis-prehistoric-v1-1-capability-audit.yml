name: OASIS Prehistoric v1.1 Capability Audit

on:
  push:
    branches:
      - storage/oasis-integrated-research-system-v1.0
    paths:
      - '.github/workflows/oasis-prehistoric-v1-1-capability-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax audit corrected files
        run: |
          node --check integrated-research-system-storage/prehistoric/src/prehistoric-clean-world-v1.1.mjs
          node --check integrated-research-system-storage/prehistoric/src/prehistoric-experiment-v1.1.mjs
      - name: Run 12-cycle capability coverage audit
        env:
          OASIS_RUN_SEED: prehistoric-civilization-v1-run0
          OASIS_MAX_CYCLES: '12'
        run: node integrated-research-system-storage/prehistoric/src/prehistoric-experiment-v1.1.mjs
      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-prehistoric-v1-1-capability-audit
          path: prehistoric-experiment-v1.1-result.json
          if-no-files-found: warn
