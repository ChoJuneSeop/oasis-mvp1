name: Founding Flow v1

on:
  push:
    branches:
      - architecture/oasis-unified-validation-system-v1
    paths:
      - 'experiments/founding-flow-v1/**'
      - 'src/validation/founding-flow-world.mjs'
      - 'src/validation/founding-flow-ancestors.mjs'
      - 'src/validation/oasis-unified-validation-system.mjs'
      - 'src/oasis-core.mjs'
      - 'src/oasis-integrated-core.mjs'
      - 'src/oasis-reference-core.mjs'
      - 'tools/founding-flow-v1.mjs'
      - '.github/workflows/founding-flow-v1.yml'

jobs:
  founding-flow-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check src/validation/oasis-unified-validation-system.mjs
          node --check src/validation/founding-flow-world.mjs
          node --check src/validation/founding-flow-ancestors.mjs
          node --check tools/founding-flow-v1.mjs

      - name: Unified-system contamination boundary audit
        run: node tools/oasis-unified-validation-system-audit.mjs

      - name: Founding Flow pre-experiment four-axis audit
        run: node tools/founding-flow-v1.mjs --audit-only

      - name: Confirm contaminated historical harness is not imported
        run: |
          if grep -R "blind-historical-flow-v2" src/validation/founding-flow-ancestors.mjs src/validation/founding-flow-world.mjs tools/founding-flow-v1.mjs; then
            echo "Old contaminated harness reference found"
            exit 1
          fi

      - name: Execute Founding Flow v1
        run: |
          mkdir -p artifacts
          node tools/founding-flow-v1.mjs | tee artifacts/founding-flow-v1.log

      - name: Upload raw traces
        uses: actions/upload-artifact@v4
        with:
          name: founding-flow-v1-report
          path: |
            artifacts/founding-flow-v1.json
            artifacts/founding-flow-v1.log
          if-no-files-found: error
