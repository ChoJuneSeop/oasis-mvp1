name: Governance OASIS A4 Scope Locality v1

on:
  push:
    branches:
      - experiment/governance-oasis-a4-scope-locality-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a4-confirmatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen scientific harness integrity
        run: python -m unittest -v research.governance_oasis_scientific_proof_harness_v1.test_freeze_integrity
      - name: A4 design and error checks
        run: python -m unittest -v research.governance_oasis_a4_scope_locality_v1.test_a4
      - name: A4 confirmatory execution
        run: |
          mkdir -p a4-artifacts
          python -m research.governance_oasis_a4_scope_locality_v1 | tee a4-artifacts/A4-CONFIRMATORY.json
      - name: Upload sealed A4 output
        uses: actions/upload-artifact@v4
        with:
          name: governance-oasis-a4-confirmatory-${{ github.run_id }}-${{ github.run_attempt }}
          path: a4-artifacts/A4-CONFIRMATORY.json
          if-no-files-found: error
