name: G3 RPFO v1.1 Regression

on:
  push:
    branches: [feature/g3-rpfo-v1]

jobs:
  rpfo-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile RPFO path
        run: python -m py_compile research/g3_rpfo_v1/rpfo.py research/g3_rpfo_v1/core.py research/g3_rpfo_v1/hardening.py research/g3_rpfo_v1/strict_core.py
      - name: Local lineage access
        run: python -m unittest research.g3_rpfo_v1.test_state_v11 -v
      - name: Deferred frontier expansion
        run: python -m unittest research.g3_rpfo_v1.test_next_frontier_v11 -v
      - name: Joint participation
        run: python -m unittest research.g3_rpfo_v1.test_combo_v11 -v
      - name: Unfold without deletion
        run: python -m unittest research.g3_rpfo_v1.test_joint_unfold_v11 -v
      - name: Provenance fail-closed
        run: python -m unittest research.g3_rpfo_v1.test_provenance_v11 -v
      - name: Strict provenance and deterministic order
        run: python -m unittest research.g3_rpfo_v1.test_strict_v11 -v
      - name: Core action-path wiring
        run: python -m unittest research.g3_rpfo_v1.test_core_path_v11 -v
      - name: Preserve Fold-v1 counterexample lineage
        run: python -m unittest research.g3_realtime_split_v1.test_fold_operator research.g3_realtime_split_v1.test_fold_counterexamples -v
