name: CBRA failure v1 Pilot

on:
  push:
    branches: [experiment/cbra-failure-v1-pilot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 067bf002296f7eb524d99337c66fc28703543226
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen snapshot
        run: |
          test "$(git rev-parse HEAD)" = "067bf002296f7eb524d99337c66fc28703543226"
      - name: Run structural Pilot
        run: |
          python -m research.governance_cbra_failure_exp_v1.runner --stage pilot > cbra_failure_v1_pilot.json
      - name: Validate Pilot structure only
        run: |
          python - <<'PY'
          import json
          x=json.load(open("cbra_failure_v1_pilot.json"))
          assert x["stage"]=="pilot"
          assert x["scientific_evaluator_used"] is False
          assert "metrics" not in x
          s=x["structural"]
          assert s["fresh_process"]
          assert s["arm_count"]==3
          assert s["case_count_per_arm"]==15
          assert s["checkpoint_exactly_one"]
          assert s["as_of_gate_exactly_one"]
          assert s["counterfactual_claimed"] is False
          PY
      - name: Hash Pilot evidence
        run: sha256sum cbra_failure_v1_pilot.json > cbra_failure_v1_pilot.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cbra-failure-v1-pilot
          path: |
            cbra_failure_v1_pilot.json
            cbra_failure_v1_pilot.sha256
