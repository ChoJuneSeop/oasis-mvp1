name: OASIS Lag3 Relational Identity Ablation

on:
  push:
    paths:
      - 'tools/latent-relation-lag3-identity-ablation.mjs'
      - '.github/workflows/latent-relation-lag3-identity-ablation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run 30k lag3 relational identity ablation
        run: node tools/latent-relation-lag3-identity-ablation.mjs
      - name: Upload identity ablation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-lag3-relational-identity-ablation
          path: latent-relation-lag3-identity-ablation-report.json
          if-no-files-found: ignore
