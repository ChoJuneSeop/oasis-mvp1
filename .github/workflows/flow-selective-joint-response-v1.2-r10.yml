name: OASIS Flow-Selective Joint Response v1.2 r10

on:
  workflow_dispatch:
  push:
    branches: ["flow-selective-joint-response-v1.2-r10"]
    paths:
      - "flow-selective-joint-response-v1.2.js"
      - "tools/flow-selective-joint-response-v1.2-r10-contract.mjs"
      - ".github/workflows/flow-selective-joint-response-v1.2-r10.yml"

permissions:
  contents: read

concurrency:
  group: oasis-fsjr-v1-2-r10
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run r10 smoke contract
        env:
          MODE: smoke
          LABEL: smoke-canonical
          OFFSET: '0'
          HORIZON: '12000'
        run: node tools/flow-selective-joint-response-v1.2-r10-contract.mjs
      - name: Upload smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsjr-v1.2-r10-smoke
          path: flow-selective-joint-response-v1.2-r10-smoke-canonical.json
          if-no-files-found: ignore

  longitudinal:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: canonical, offset: 0}
          - {label: E137, offset: 137}
          - {label: E977, offset: 977}
          - {label: E4099, offset: 4099}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run r10 120k contract
        env:
          MODE: full
          LABEL: ${{ matrix.label }}
          OFFSET: ${{ matrix.offset }}
          HORIZON: '120000'
        run: node tools/flow-selective-joint-response-v1.2-r10-contract.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsjr-v1.2-r10-${{ matrix.label }}
          path: flow-selective-joint-response-v1.2-r10-${{ matrix.label }}.json
          if-no-files-found: ignore
