name: OASIS Latent Relation Admission Gate Fast Validation

on:
  push:
    branches: ["main"]
    paths:
      - "tools/latent-relation-admission-gate-fast-validation.mjs"
      - "tools/validation-compatibility-guard.mjs"
      - ".github/workflows/latent-relation-admission-gate-fast.yml"
  workflow_dispatch:

concurrency:
  group: oasis-latent-relation-admission-gate-fast
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run fast retrieval-admission validation
        run: node tools/latent-relation-admission-gate-fast-validation.mjs
      - name: Upload exact admission audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-latent-relation-admission-gate-fast-report
          path: |
            latent-relation-admission-fast-report.json
            latent-relation-admission-fast-audit.jsonl
            latent-relation-admission-fast-counterfactual.jsonl
          if-no-files-found: ignore
