name: OASIS H2 Noncurrent Relation Key Future Effect v3

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/h2-noncurrent-key-future-effect-v3.mjs"
      - "tools/validation-compatibility-guard.mjs"
      - ".github/workflows/h2-noncurrent-key-future-effect-v3.yml"

concurrency:
  group: oasis-h2-noncurrent-key-future-effect-v3
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run H2 noncurrent relation-key future-effect analysis
        run: node tools/h2-noncurrent-key-future-effect-v3.mjs
      - name: Upload H2 noncurrent relation-key evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-h2-noncurrent-key-future-effect-v3
          path: h2-noncurrent-key-future-effect-v3-report.json
          if-no-files-found: ignore
