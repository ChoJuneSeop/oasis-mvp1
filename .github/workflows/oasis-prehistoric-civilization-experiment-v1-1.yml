name: OASIS Prehistoric Civilization Experiment v1.1 Corrected

on:
  push:
    branches:
      - storage/oasis-integrated-research-system-v1.0
    paths:
      - '.github/workflows/oasis-prehistoric-civilization-experiment-v1-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax audit corrected experiment
        run: |
          node --check integrated-research-system-storage/prehistoric/src/prehistoric-clean-world-v1.1.mjs
          node --check integrated-research-system-storage/prehistoric/src/prehistoric-experiment-v1.1.mjs
          node --check integrated-research-system-storage/prehistoric/src/prehistoric-civilization-observer-v1.mjs
      - name: Run corrected continuous prehistoric Run 0
        env:
          OASIS_RUN_SEED: prehistoric-civilization-v1-run0
          OASIS_MAX_CYCLES: '120'
        run: node integrated-research-system-storage/prehistoric/src/prehistoric-experiment-v1.1.mjs
      - name: Upload corrected compact result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-prehistoric-civilization-v1-1-run0
          path: prehistoric-experiment-v1.1-result.json
          if-no-files-found: warn
