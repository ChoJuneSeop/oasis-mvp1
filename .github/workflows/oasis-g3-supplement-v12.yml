name: OASIS G3 supplement v1.2 contract checks
on:
  push:
    branches:
      - implementation/oasis-g3-supplement-v1.2
  pull_request:
    paths:
      - 'research/oasis_core_v12/**'
      - '.github/workflows/oasis-g3-supplement-v12.yml'
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preserved and supplementary source hashes
        run: python -m research.oasis_core_v12.verify_manifest
      - name: Run existing and supplementary regression checks
        run: >-
          python -m unittest
          research.oasis_core_v11.test_current_relational_core
          research.oasis_core_v11.test_history_admission
          research.oasis_core_v11.test_carla_relational_domain
          research.carla_v22_harness_v11.test_canonical_harness
          research.g3_2_sidecar.test_runtime_extension
          research.g3_2_sidecar.test_legacy_v1_compat
          research.oasis_core_v12.test_supplement -v
      - name: Run preserved and supplementary synthetic wiring
        run: |
          python -m research.oasis_core_v11.synthetic_integrated_flow
          python -m research.oasis_core_v12.synthetic_integrated_flow
