name: MVP3 Reality Flow Kill Search

on:
  push:
    branches: ["mvp3-reality-flow-kill"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reality-flow-kill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run MVP2 same-coordinate different-flow falsification
        run: node tools/reality-flow-mvp2-falsification.mjs
      - name: Upload falsification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-flow-mvp2-falsification-report
          path: reality-flow-mvp2-falsification-report.json
          if-no-files-found: ignore
