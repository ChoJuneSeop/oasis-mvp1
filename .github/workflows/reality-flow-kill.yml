name: MVP3 Reality Flow Kill Search

on:
  push:
    branches: ["mvp3-reality-flow-kill"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reality-flow-kill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run MVP2 same-coordinate different-flow falsification
        run: node tools/reality-flow-mvp2-falsification.mjs
      - name: Run MVP3 Reality Flow validation
        run: node tools/reality-flow-mvp3-validation.mjs
      - name: Run Reality Flow compatibility regression
        run: node tools/reality-flow-regression.mjs
      - name: Run live MVP3 loader integration
        run: node tools/reality-flow-live-app-test.mjs
      - name: Run Stage 7 trajectory aliasing kill
        run: node tools/reality-flow-aliasing-kill.mjs
      - name: Run Stage 8 run-structure observation
        run: node tools/reality-flow-runstructure-observation.mjs
      - name: Run Stage 8 topology authority validation
        run: node tools/reality-flow-topology-validation.mjs
      - name: Run Stage 8 topology live viability regression
        run: node tools/reality-flow-topology-live-regression.mjs
      - name: Run Stage 9 legacy authority contamination kill
        run: node tools/reality-flow-legacy-contamination-kill.mjs
      - name: Run Stage 10 topology causal isolation
        run: node tools/reality-flow-topology-isolation-validation.mjs
      - name: Run Stage 11 residual history-gate authority kill
        run: node tools/reality-flow-relation-gate-contamination-kill.mjs
      - name: Run Stage 12A minimal evidence-execution boundary
        run: node tools/reality-flow-execution-authority-validation.mjs
      - name: Run Stage 12A live authority-turnover regression
        run: node tools/reality-flow-execution-authority-live-regression.mjs
      - name: Run Stage 12B explicit known-authorized-dormant separation
        run: node tools/reality-flow-authority-separation-validation.mjs
      - name: Run Stage 12B live known-authorized turnover regression
        run: node tools/reality-flow-authority-live-regression.mjs
      - name: Run Stage 13 fixed recency-window artifact kill
        run: node tools/reality-flow-retention-window-kill.mjs
      - name: Run Stage 14 fixed episode-cap artifact kill
        run: node tools/reality-flow-episode-cap-kill.mjs
      - name: Upload Reality Flow reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-flow-stage2-stage14-reports
          path: |
            reality-flow-mvp2-falsification-report.json
            reality-flow-mvp3-validation-report.json
            reality-flow-regression-report.json
            reality-flow-live-app-report.json
            reality-flow-aliasing-kill-report.json
            reality-flow-runstructure-observation-report.json
            reality-flow-topology-validation-report.json
            reality-flow-topology-live-report.json
            reality-flow-legacy-contamination-report.json
            reality-flow-topology-isolation-report.json
            reality-flow-relation-gate-contamination-report.json
            reality-flow-execution-authority-report.json
            reality-flow-execution-authority-live-report.json
            reality-flow-authority-separation-report.json
            reality-flow-authority-live-report.json
            reality-flow-retention-window-kill-report.json
            reality-flow-episode-cap-kill-report.json
          if-no-files-found: ignore
