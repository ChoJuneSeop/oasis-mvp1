name: OASIS O3 Danger Structural Matched Long Horizon

on:
  push:
    paths:
      - '.github/workflows/o3-danger-structural-matched-long.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run 120k matched structural-state danger test
        run: MAX_TICK=120000 node tools/o3-danger-structural-matched-test.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-o3-danger-structural-matched-120k
          path: o3-danger-structural-matched-120000-report.json
          if-no-files-found: ignore
