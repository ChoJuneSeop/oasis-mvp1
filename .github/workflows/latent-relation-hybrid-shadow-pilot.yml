name: OASIS Exact-Seeded Hybrid Shadow Pilot

on:
  push:
    paths:
      - 'tools/latent-relation-hybrid-shadow-pilot.mjs'
      - '.github/workflows/latent-relation-hybrid-shadow-pilot.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run 30k exact-seeded hybrid shadow pilot
        run: node tools/latent-relation-hybrid-shadow-pilot.mjs
      - name: Upload hybrid shadow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-latent-hybrid-shadow-pilot
          path: latent-relation-hybrid-shadow-pilot-report.json
          if-no-files-found: ignore
