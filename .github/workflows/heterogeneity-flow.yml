name: OASIS Heterogeneity Flow Validation

on:
  push:
    branches: ["validation/heterogeneity-flow"]
    paths:
      - "tools/heterogeneity-flow-test.mjs"
      - "tools/heterogeneity-closed-experience-test.mjs"
      - "tools/heterogeneity-within-seed-coupling-test.mjs"
      - "tools/flow-responsibility-estimator-test.mjs"
      - "tools/coordinate-free-flow-closure-test.mjs"
      - "relation-field.js"
      - "index.html"
      - ".github/workflows/heterogeneity-flow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heterogeneity-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run legacy post-hoc heterogeneity flow validation
        run: node tools/heterogeneity-flow-test.mjs
      - name: Run isolated closed-experience flow validation
        run: node tools/heterogeneity-closed-experience-test.mjs
      - name: Run within-seed coupling validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/heterogeneity-within-seed-coupling-test.mjs')
          s = p.read_text()
          old = 'supportDecisionMass,changedSupportMass,transmissionRate:'
          new = 'supportDecisionMass,changedSupportMass:changedMass,transmissionRate:'
          if old not in s:
              raise SystemExit('expected one-line instrumentation typo not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node tools/heterogeneity-within-seed-coupling-test.mjs
      - name: Run isolated flow responsibility estimator validation
        run: node tools/flow-responsibility-estimator-test.mjs
      - name: Run coordinate-free flow closure holdout validation
        run: node tools/coordinate-free-flow-closure-test.mjs
      - name: Upload heterogeneity flow reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heterogeneity-flow-report
          path: |
            heterogeneity-flow-report.json
            heterogeneity-closed-experience-report.json
            heterogeneity-within-seed-coupling-report.json
            flow-responsibility-estimator-report.json
            coordinate-free-flow-closure-report.json
          if-no-files-found: ignore
