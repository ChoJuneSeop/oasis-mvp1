name: OASIS Heterogeneity Flow Test

on:
  push:
    branches: ["experiment/heterogeneity-flow"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heterogeneity-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run post-heterogeneity flow experiment
        run: node tools/heterogeneity-flow-test.mjs
      - name: Upload heterogeneity flow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-heterogeneity-flow-report
          path: heterogeneity-flow-report.json
          if-no-files-found: ignore
