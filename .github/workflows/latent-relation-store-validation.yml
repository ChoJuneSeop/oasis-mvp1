name: OASIS Latent Relation Store Validation

on:
  push:
    branches: ["main"]
    paths:
      - "relation-field.js"
      - "tools/latent-relation-store-validation.mjs"
      - "tools/validation-compatibility-guard.mjs"
      - ".github/workflows/latent-relation-store-validation.yml"
  workflow_dispatch:

concurrency:
  group: oasis-latent-relation-store-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run latent relation store validation
        run: node tools/latent-relation-store-validation.mjs
      - name: Upload exact audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-latent-relation-store-validation-report
          path: latent-relation-store-validation-report.json
          if-no-files-found: ignore
