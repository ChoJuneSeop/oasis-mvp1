name: OASIS Danger Circular-Shift Cached Long Validation

on:
  push:
    paths:
      - '.github/workflows/latent-relation-danger-circular-surrogate-cached-long.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Add same-current eval cache to validation copy only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/latent-relation-danger-circular-surrogate-control.mjs')
          s=p.read_text()
          old1="const retrieved=I.candidates(S,P),noLat=evalIds(P,[]);"
          new1="const retrieved=I.candidates(S,P),noLat=evalIds(P,[]),evalCache=new Map([['',noLat]]);"
          old2="const ids=gateIds(name,P,retrieved,idx),out=evalIds(P,ids),st=gateState[name].stats;"
          new2="const ids=gateIds(name,P,retrieved,idx),cacheKey=[...ids].sort().join('|'),st=gateState[name].stats;let out=evalCache.get(cacheKey);if(!out){out=evalIds(P,ids);evalCache.set(cacheKey,out)}"
          if old1 not in s or old2 not in s: raise SystemExit('cache patch target missing')
          p.write_text(s.replace(old1,new1,1).replace(old2,new2,1))
          PY
      - name: Run cached 30k equivalence check
        run: node tools/latent-relation-danger-circular-surrogate-control.mjs
      - name: Assert exact 30k statistical equivalence
        run: |
          python3 - <<'PY'
          import json, math
          r=json.load(open('latent-relation-danger-circular-surrogate-control-report.json'))
          g=r['gates']; n=r['null']
          expected={'exactProvenance':(5668,3,3),'completedProcess':(34304,33,28),'lag0':(21388,28,23),'lag1':(21250,33,28),'lag2':(22499,30,25),'lag3':(21510,34,29)}
          assert r['replayMismatch']==0
          assert r['uniqueOffsetTuples']==127
          for k,(entries,dd,cd) in expected.items():
              assert (g[k]['entries'],g[k]['decisionDiffs'],g[k]['choiceDiffs'])==(entries,dd,cd),(k,g[k])
          assert n['count']==127 and n['exceedLag3']==1
          assert math.isclose(n['empiricalP'],0.015625,rel_tol=0,abs_tol=1e-15)
          assert math.isclose(n['bonferroniP'],0.0625,rel_tol=0,abs_tol=1e-15)
          print('PASS: cached 30k statistics exactly match uncached reference counts and p-values')
          PY
      - name: Preserve cached 30k report
        run: cp latent-relation-danger-circular-surrogate-control-report.json cached-surrogate-30k-equivalence-report.json
      - name: Expand only horizon to 120k
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/latent-relation-danger-circular-surrogate-control.mjs')
          s=p.read_text()
          old='const PORT=4200, MAX_TICK=30000, SURROGATE_COUNT=127;'
          new='const PORT=4200, MAX_TICK=120000, SURROGATE_COUNT=127;'
          if old not in s: raise SystemExit('horizon replacement target missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Run cached 120k 127-shift control
        run: node tools/latent-relation-danger-circular-surrogate-control.mjs
      - name: Preserve cached 120k report
        run: cp latent-relation-danger-circular-surrogate-control-report.json cached-surrogate-120k-report.json
      - name: Upload cached reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-danger-circular-surrogate-cached-long
          path: |
            cached-surrogate-30k-equivalence-report.json
            cached-surrogate-120k-report.json
          if-no-files-found: ignore
