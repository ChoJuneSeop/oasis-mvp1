name: OASIS Actual Browser World Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run actual browser world
        run: node tools/browser-world-test.mjs
      - name: Upload world report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-browser-world-report
          path: browser-world-report.json
          if-no-files-found: ignore
