name: OASIS G3.2 live execution supplement v1

on:
  push:
    branches:
      - oasis-g32-live-v1
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen baseline remains untouched
        run: |
          python - <<'PY'
          import subprocess
          baseline='5ccccc1fe9e3b25305ab2f133fd8cb0e63d1c954'
          changed=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          allowed=[]
          for path in changed:
              if path == '.github/workflows/oasis-g32-live-supplement-v1.yml':
                  allowed.append(path)
              elif path.startswith('research/g32_live_execution_v1/'):
                  allowed.append(path)
              else:
                  raise SystemExit(f'frozen baseline path changed: {path}')
          print('baseline-diff-guard=PASS')
          print('\n'.join(allowed))
          PY
      - name: Compile live supplement
        run: python -m compileall -q research/g32_live_execution_v1
      - name: Run live supplement tests
        run: |
          python -m unittest research.g32_live_execution_v1.test_live_core -v
          python -m unittest research.g32_live_execution_v1.test_live_history -v
          python -m unittest research.g32_live_execution_v1.test_runtime_freeze -v
      - name: Re-run frozen G3.2 integration tests
        run: |
          python -m unittest research.oasis_core_v11.test_current_relational_core -v
          python -m unittest research.oasis_core_v11.test_history_admission -v
          python -m unittest research.oasis_core_v11.test_carla_relational_domain -v
          python -m unittest research.oasis_core_v11.test_carla_domain_policy_v1 -v
          python -m unittest research.oasis_core_v11.test_carla_domain_bundle_v1 -v
          python -m unittest research.carla_v22_harness_v11.test_canonical_harness -v
          python -m unittest research.carla_v22_harness_v11.test_carla_runtime_adapter_v1 -v
          python -m unittest research.carla_v22_harness_v11.test_independent_evaluator_v1 -v
          python -m unittest research.g3_2_sidecar.test_runtime_extension -v
          python -m unittest research.g3_2_sidecar.test_legacy_v1_compat -v
          python -m unittest research.oasis_core_v12.test_supplement -v
          python -m unittest research.choice_responsibility_v01.test_integration -v
          python -m unittest research.integration_checkpoint.test_cross -v
          python -m unittest research.integration_checkpoint.test_harness_adapter -v
      - name: Verify frozen live source manifest
        run: python research/g32_live_execution_v1/verify_manifest.py
      - name: Record live supplement source hashes
        run: |
          sha256sum \
            research/g32_live_execution_v1/__init__.py \
            research/g32_live_execution_v1/operators.py \
            research/g32_live_execution_v1/live_core.py \
            research/g32_live_execution_v1/episode.py \
            research/g32_live_execution_v1/live_history.py \
            research/g32_live_execution_v1/ledger.py \
            research/g32_live_execution_v1/runtime_freeze.py \
            research/g32_live_execution_v1/runner.py \
            research/g32_live_execution_v1/test_live_core.py \
            research/g32_live_execution_v1/test_live_history.py \
            research/g32_live_execution_v1/test_runtime_freeze.py \
            research/g32_live_execution_v1/LIVE_SOURCE_MANIFEST.json \
            research/g32_live_execution_v1/verify_manifest.py
