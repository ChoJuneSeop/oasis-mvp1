name: Governance OASIS A5 Sequence Closure v1

on:
  push:
    branches:
      - program/governance-oasis-a5-sequence-closure-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a5-sequence-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen scientific harness integrity
        run: python -m unittest -v research.governance_oasis_scientific_proof_harness_v1.test_freeze_integrity
      - name: A5 sequence closure audit
        run: python -m research.governance_oasis_program_v1.audit_after_a5
