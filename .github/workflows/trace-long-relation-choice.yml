name: OASIS Long Relation Decision Genealogy Trace

on:
  push:
    branches: ["main"]
    paths:
      - "tools/trace-first-long-relation-choice.mjs"
      - "tools/validation-compatibility-guard.mjs"
      - ".github/workflows/trace-long-relation-choice.yml"
      - "relation-field.js"
  workflow_dispatch:

concurrency:
  group: oasis-long-relation-choice-trace
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Trace first true long-relation choice genealogy
        run: node tools/trace-first-long-relation-choice.mjs
      - name: Upload genealogy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-first-long-relation-choice-genealogy
          path: first-long-relation-choice-genealogy.json
          if-no-files-found: ignore
