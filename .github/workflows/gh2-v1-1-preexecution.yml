name: GH-2 v1.1 Pre-execution Validation

on:
  push:
    branches:
      - feature/governance-harness-gh2-v1-1
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile GH-2 v1.1
        run: |
          python -m py_compile \
            research/governance_harness_gh2/models.py \
            research/governance_harness_gh2/scenario.py \
            research/governance_harness_gh2/responsibility.py \
            research/governance_harness_gh2/runner.py \
            research/governance_harness_gh2/admission/preflight.py \
            research/governance_harness_gh2/admission/test_gh2.py

      - name: GH-2 v1.1 admission tests
        run: python -m unittest discover -s research/governance_harness_gh2/admission -p 'test_*.py' -v

      - name: GH-2 v1.1 preflight
        run: python -m research.governance_harness_gh2.admission.preflight

      - name: Governance Harness regressions
        run: python -m unittest discover -s research/governance_harness_v01 -p 'test_*.py' -v

      - name: Canonical Harness regressions
        run: python -m unittest discover -s research/carla_v22_harness_v11 -p 'test_*.py' -v

      - name: Core regressions excluding documented legacy incompatibility
        run: |
          python - <<'PY'
          import unittest

          target = (
              'test_carla_domain_bundle_v1.DomainBundleTests.'
              'test_bundle_runs_through_canonical_harness'
          )
          discovered = unittest.defaultTestLoader.discover(
              'research/oasis_core_v11', pattern='test_*.py'
          )

          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item

          tests = list(flatten(discovered))
          kept = [test for test in tests if not test.id().endswith(target)]
          removed = [test for test in tests if test.id().endswith(target)]
          if len(removed) != 1:
              raise SystemExit(f'expected exactly one documented baseline test, got {len(removed)}')
          suite = unittest.TestSuite(kept)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f'CORE_NONBASELINE_PASS_COUNT={result.testsRun}')
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY

      - name: Verify exact documented baseline Core failure
        run: |
          set +e
          python -m unittest \
            research.oasis_core_v11.test_carla_domain_bundle_v1.DomainBundleTests.test_bundle_runs_through_canonical_harness \
            -v > /tmp/gh2-v11-known-baseline.log 2>&1
          code=$?
          set -e
          cat /tmp/gh2-v11-known-baseline.log
          test "$code" -ne 0
          grep -Fq "direct domain-bundle history injection is removed; Governance must supply a participating view" /tmp/gh2-v11-known-baseline.log

      - name: Verify frozen lineage untouched
        run: |
          test -z "$(git diff --name-only 5861b08d6b48f79b88f4f160bbb425690708ccd4 HEAD -- research/governance_harness_v01 research/governance_harness_gh1l research/oasis_core_v11)"

      - name: Verify v1.1 execution outputs absent
        run: |
          test ! -f research/governance_harness_gh2/results/PILOT_RESULT_V1_1.json
          test ! -f research/governance_harness_gh2/results/CONFIRMATORY_RESULT_V1_1.json
