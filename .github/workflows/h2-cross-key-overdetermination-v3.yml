name: OASIS H2 Cross-Key Overdetermination v3

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/causal-redundancy-source-120k.mjs"
      - "tools/h2-cross-key-overdetermination-v3.mjs"
      - "tools/validation-compatibility-guard.mjs"
      - ".github/workflows/h2-cross-key-overdetermination-v3.yml"

concurrency:
  group: oasis-h2-cross-key-overdetermination-v3
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run H2 cross-key overdetermination analysis
        run: node tools/h2-cross-key-overdetermination-v3.mjs
      - name: Upload H2 cross-key evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-h2-cross-key-overdetermination-v3
          path: |
            causal-redundancy-source-120k-report.json
            h2-cross-key-overdetermination-v3-report.json
          if-no-files-found: ignore
