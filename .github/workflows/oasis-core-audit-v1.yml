name: oasis-core-audit-v1
on:
  push:
    branches: [experiment/prehistoric-personality-lab]
    paths:
      - 'experiments/oasis-core-audit-v1.mjs'
      - 'experiments/prehistoric-society-v3-core.js'
      - 'experiments/prehistoric-society-v3-decisions.js'
      - 'experiments/prehistoric-society-v3-world.js'
      - '.github/workflows/oasis-core-audit-v1.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run OASIS implementation validity audit
        run: |
          set +e
          node experiments/oasis-core-audit-v1.mjs | tee oasis-core-audit-v1-result.json
          code=${PIPESTATUS[0]}
          echo "audit_exit_code=$code"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: oasis-core-audit-v1-result
          path: oasis-core-audit-v1-result.json
