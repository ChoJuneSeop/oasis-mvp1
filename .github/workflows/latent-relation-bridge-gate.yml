name: OASIS Relational Bridge Reactivation Full Validation

on:
  push:
    paths:
      - 'tools/latent-relation-bridge-gate-validation.mjs'
      - '.github/workflows/latent-relation-bridge-gate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Guard canonical validation conditions
        run: node tools/validation-compatibility-guard.mjs
      - name: Run 120k relational bridge validation
        env:
          OASIS_BRIDGE_MAX_TICK: 120000
        run: node tools/latent-relation-bridge-gate-validation.mjs
      - name: Upload bridge audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oasis-latent-relation-bridge-full
          path: |
            latent-relation-bridge-report.json
            latent-relation-bridge-audit.jsonl
            latent-relation-bridge-counterfactual.jsonl
          if-no-files-found: ignore
