<body><div class="app">
<div class="top"><div><div class="title">OASIS MVP2 · Dual Comparison Laboratory</div><div class="sub" id="subtitle"></div></div><div class="ctl"><div class="tabs"><button id="tabAbl">내부 절제</button><button id="tabExt">기존모델 비교</button></div><button id="toggle">일시정지</button><button id="step">1틱</button><button id="run100">+100틱</button><button id="replay">동일상황 재시험</button><select id="speed"><option value="450">x1</option><option value="150">x3</option><option value="50">x8</option></select><button id="reset">초기화</button></div></div>
<div class="lab"><section class="card"><h2>세계 관찰 · <select id="focus"></select> · <select id="focusParty"></select></h2><canvas id="world" width="960" height="600"></canvas><div class="hud"><div class="met"><b id="day">1일</b><span>시간</span></div><div class="met"><b id="danger">낮음</b><span>위험</span></div><div class="met"><b id="relations">0</b><span>관계이력</span></div><div class="met"><b id="candidate">0</b><span>후보변화</span></div><div class="met"><b id="decision">0</b><span>전체전이</span></div><div class="met"><b id="spiral">0</b><span>총나선</span></div><div class="met"><b id="hidden">0</b><span>히든 후보</span></div><div class="met"><b id="stories">0</b><span>히든 발생</span></div></div></section><div class="right"><section class="card"><h2 id="compareTitle">비교</h2><div class="compare" id="compare"></div></section><section class="card"><h2>원인 분해 지표</h2><div style="overflow:auto"><table class="table" id="metrics"></table></div></section><section class="card"><h2>현재 판단 / 로그</h2><div class="note" id="explain"></div><div class="log" id="log"></div></section></div></div>

<script>
const $=x=>document.getElementById(x),cv=$('world'),ctx=cv.getContext('2d');
const places={village:{x:120,y:345,n:'새벽마을',pub:1,r:.05},road:{x:300,y:390,n:'갈림길',pub:1,r:.12},forest:{x:370,y:215,n:'속삭임숲',pub:1,r:.25},lake:{x:670,y:455,n:'별빛호수',pub:1,r:.12},market:{x:205,y:155,n:'바람시장',pub:1,r:.08},camp:{x:500,y:350,n:'유랑캠프',pub:1,r:.18},ruin:{x:720,y:165,n:'고대유적',r:.5,gate:'엘리'},tower:{x:845,y:315,n:'감시탑',r:.42,gate:'도른'},shrine:{x:555,y:105,n:'별의성소',r:.3,gate:'미라'},canyon:{x:825,y:505,n:'붉은협곡',r:.62,gate:'아론'}};
const npcs=[['미라','market'],['도른','village'],['엘리','forest'],['아론','camp'],['세인','lake'],['루카','road'],['베라','shrine'],['???','camp']];
const mem=[['세라','전사',.78,.45,.52],['리안','치유사',.42,.9,.48],['카이','정찰자',.62,.52,.88],['노아','마도사',.48,.56,.76]];
const defs=[['dawn','새벽의 창','village'],['star','유랑별','market'],['blue','푸른방패','lake']];
const MODELS={
full:{n:'OASIS-Full',group:'both',kind:'oasis',rel:1,fb:1,desc:'OASIS 고유 구조'},
norel:{n:'NoRelation',group:'ablation',kind:'oasis',rel:0,fb:1,desc:'OASIS 관계축 절제'},
nofb:{n:'NoFeedback',group:'ablation',kind:'oasis',rel:0,fb:0,desc:'OASIS 피드백 절제'},
static:{n:'StaticPreference',group:'ablation',kind:'static',rel:0,fb:0,desc:'고정 선호 절제군'},
rule:{n:'Rule-Based',group:'external',kind:'rule',fb:0,desc:'조건-규칙 정책 참고형'},
utility:{n:'Utility Agent',group:'external',kind:'utility',fb:1,desc:'상태 효용 점수 정책 참고형'},
qlite:{n:'Q-Learning-like',group:'external',kind:'q',fb:1,desc:'상태-행동 보상학습 참고형'},
retrieval:{n:'Retrieval-Memory',group:'external',kind:'retrieval',fb:1,desc:'유사 경험 검색·재사용 참고형'}
};
const hiddenDefs=[{id:'wanderer',name:'이름 없는 여행자의 기억',npc:'???',links:['아론'],places:['camp','canyon']},{id:'starEcho',name:'별빛 아래 남겨진 약속',npc:'세인',links:['미라'],places:['lake','market']},{id:'herbRuin',name:'숲이 기억하는 폐허',npc:'엘리',links:[],places:['forest','ruin']}];
const off=[[-16,-10],[16,-10],[-16,12],[16,12]],staticOrder=['village','road','forest','camp','lake','market'];let E,labMode='external',focus='full',focusParty='dawn',timer;
function hash(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967296}
function noise(...x){return hash(x.join('|'))}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function env(t){return{pulse:(noise('d',t)-.5)*.02+(noise('shock',Math.floor(t/5))<.07?(noise('dd',Math.floor(t/5))-.4)*.22:0)}}
function mkP(d){const q=places[d[2]];return{id:d[0],name:d[1],target:'road',members:mem.map((m,i)=>({name:m[0],role:m[1],c:m[2],care:m[3],cur:m[4],hp:100,x:q.x+off[i][0],y:q.y+off[i][1]})),disc:new Set([d[2],'road']),vis:{},routes:new Set(),last:'',leader:'',hiddenCandidates:new Set(),hiddenDone:new Set(),seenNPC:new Set(),relationHistory:[],choiceHistory:[],pendingRelChoice:null,q:{},memory:[]}}
function mkW(k){return{key:k,danger:.12,events:[],spiral:0,c:{exp:0,rel:0,part:0,cand:0,decision:0,flow:0,hidden:0,expTransition:0,actions:0,structuralExpansion:0,participationTransition:0,choiceTransition:0,experienceSpiral:0,relationSpiral:0},parties:defs.map(mkP)}}
function log(S,s){S.events.unshift({t:E.tick,s});S.events=S.events.slice(0,100)}function center(P){return{x:P.members.reduce((a,m)=>a+m.x,0)/4,y:P.members.reduce((a,m)=>a+m.y,0)/4}}
function currentPlace(P){const c=center(P);return Object.keys(places).sort((a,b)=>Math.hypot(places[a].x-c.x,places[a].y-c.y)-Math.hypot(places[b].x-c.x,places[b].y-c.y))[0]}
function relationExists(P,n){return P.relationHistory.some(e=>e.npc===n)}function availableOasis(S,P,use=1){return Object.keys(places).filter(id=>places[id].pub||(use&&MODELS[S.key].rel&&relationExists(P,places[id].gate)))}
function publicPlaces(){return Object.keys(places).filter(id=>places[id].pub)}function actionableIds(S,P,use=1){const ids=MODELS[S.key].kind==='oasis'?availableOasis(S,P,use):publicPlaces(),here=currentPlace(P),other=ids.filter(id=>id!==here);return other.length?other:ids}
function hiddenReady(S,P,h){if(!MODELS[S.key].rel)return false;if(!P.seenNPC.has(h.npc))return false;if(!h.links.every(n=>relationExists(P,n)))return false;return h.places.every(id=>P.disc.has(id)||availableOasis(S,P,1).includes(id))}
function refreshHidden(S,P){if(!MODELS[S.key].rel){P.hiddenCandidates.clear();return}for(const h of hiddenDefs){const ready=hiddenReady(S,P,h),was=P.hiddenCandidates.has(h.id);if(ready&&!P.hiddenDone.has(h.id)){P.hiddenCandidates.add(h.id);if(!was){S.c.hidden++;S.c.cand++;log(S,`${P.name}: 관계과정으로 히든 가능성 생성 「${h.name}」`)}}else if(!ready&&was)P.hiddenCandidates.delete(h.id)}}
function participants(S,P,useRel=1){const ids=actionableIds(S,P,useRel),sc=P.members.map(m=>{const anchor=m.role==='전사'?m.c:m.role==='치유사'?1-m.care:m.role==='정찰자'?m.cur:(m.c+m.cur)/2;return[m.role,Math.abs(anchor-S.danger)]}).sort((a,b)=>a[1]-b[1]);const best=sc[0]?.[1]??0,set=new Set(sc.filter(x=>x[1]===best).map(x=>x[0]));if(useRel&&MODELS[S.key].rel&&P.relationHistory.length)set.add('마도사');return set.size?set:new Set(P.members.map(m=>m.role))}
function cmpTuple(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]??0,y=b[i]??0;if(x!==y)return y-x}return 0}
function memberRank(S,P,m,id,useRel=1){const d=places[id],unseen=!P.disc.has(id),npcRelated=useRel&&MODELS[S.key].rel&&npcs.some(n=>n[1]===id&&relationExists(P,n[0])),flowFit=-Math.abs(d.r-S.danger),riskFit=-Math.abs(d.r-m.c),novelty=unseen?m.cur:0,careFit=-Math.abs(d.r-(1-m.care)),relationFit=npcRelated?1:0,revisit=-(P.vis[id]||0),distance=-Math.hypot(d.x-center(P).x,d.y-center(P).y);return m.role==='전사'?[flowFit,riskFit,relationFit,novelty,revisit,distance]:m.role==='치유사'?[flowFit,careFit,relationFit,-d.r,revisit,distance]:m.role==='정찰자'?[novelty,flowFit,riskFit,relationFit,revisit,distance]:[relationFit,flowFit,novelty,riskFit,revisit,distance]}
function evalOasis(S,P,use=1){const ids=actionableIds(S,P,use),active=participants(S,P,use),points=Object.fromEntries(ids.map(id=>[id,0])),voices=Object.fromEntries(ids.map(id=>[id,[]]));for(const m of P.members.filter(m=>active.has(m.role))){const ranked=[...ids].sort((a,b)=>cmpTuple(memberRank(S,P,m,a,use),memberRank(S,P,m,b,use)));ranked.forEach((id,rank)=>{points[id]+=ids.length-rank;voices[id].push([m.name,ids.length-rank])})}let rows=ids.map(id=>({id,votes:points[id],voices:voices[id]}));if(use&&MODELS[S.key].rel)for(const h of hiddenDefs)if(P.hiddenCandidates.has(h.id)&&!P.hiddenDone.has(h.id))rows.push({id:'hidden:'+h.id,votes:Math.max(...rows.map(r=>r.votes),0)+1,voices:[['관계과정',1]]});return rows.sort((a,b)=>b.votes-a.votes||noise('tie',E.tick,P.id,a.id)-noise('tie',E.tick,P.id,b.id))}
function stateKey(S){return S.danger<.3?'low':S.danger<.6?'mid':'high'}function rewardFor(S,P,id){const d=places[id];return 1-Math.abs(d.r-S.danger)+(P.disc.has(id)?.05:.18)-(P.vis[id]||0)*.015}
function evalExternal(S,P){const ids=actionableIds(S,P,0),kind=MODELS[S.key].kind,here=currentPlace(P);if(kind==='static'){const start=Math.max(0,staticOrder.indexOf(here));return ids.map(id=>({id,votes:-(staticOrder.indexOf(id)-start+staticOrder.length)%staticOrder.length,voices:[['고정순환',1]]})).sort((a,b)=>b.votes-a.votes)}if(kind==='rule'){const target=S.danger>.55?ids.slice().sort((a,b)=>places[a].r-places[b].r)[0]:S.danger<.2?ids.slice().sort((a,b)=>places[b].r-places[a].r)[0]:ids.slice().sort((a,b)=>Math.abs(places[a].r-S.danger)-Math.abs(places[b].r-S.danger))[0];return ids.map(id=>({id,votes:id===target?1:0,voices:[['규칙',1]]})).sort((a,b)=>b.votes-a.votes||noise('r',E.tick,P.id,a.id)-noise('r',E.tick,P.id,b.id))}if(kind==='utility')return ids.map(id=>{const utility=1-Math.abs(places[id].r-S.danger)+(P.disc.has(id)?.05:.2)-(P.vis[id]||0)*.02;return{id,votes:utility,voices:[['효용',utility]]}}).sort((a,b)=>b.votes-a.votes);if(kind==='q'){const st=stateKey(S);return ids.map(id=>({id,votes:P.q[st+'|'+id]??0,voices:[['Q값',P.q[st+'|'+id]??0]]})).sort((a,b)=>b.votes-a.votes||noise('q',E.tick,P.id,a.id)-noise('q',E.tick,P.id,b.id))}if(kind==='retrieval'){return ids.map(id=>{const sims=P.memory.filter(x=>x.id===id).slice(-6),v=sims.length?sims.reduce((a,x)=>a+(1-Math.abs(x.d-S.danger))*x.r,0)/sims.length:.1;return{id,votes:v,voices:[['검색기억',v]]}}).sort((a,b)=>b.votes-a.votes||noise('m',E.tick,P.id,a.id)-noise('m',E.tick,P.id,b.id))}return ids.map(id=>({id,votes:0,voices:[['기본',0]]}))}
function evalP(S,P,use=1){return MODELS[S.key].kind==='oasis'?evalOasis(S,P,use):evalExternal(S,P)}function sig(rows){if(!rows.length)return{};return{choice:rows[0].id,cands:rows.map(x=>x.id).sort().join(','),leader:[...rows[0].voices].sort((a,b)=>b[1]-a[1])[0]?.[0]||''}}function changedSig(a,b){return a.choice!==b.choice||a.cands!==b.cands||a.leader!==b.leader}
function choose(S,P){if(MODELS[S.key].kind==='oasis')refreshHidden(S,P);const g=sig(evalP(S,P,1));if(P.last&&P.last!==g.cands)S.c.cand++;if(P.leader&&P.leader!==g.leader)S.c.part++;P.last=g.cands;P.leader=g.leader;if(g.choice?.startsWith('hidden:')&&MODELS[S.key].rel){const h=hiddenDefs.find(x=>x.id===g.choice.slice(7));P.hiddenDone.add(h.id);P.hiddenCandidates.delete(h.id);P.target=h.places[h.places.length-1];log(S,`${P.name}: 히든 스토리 선택 ★ 「${h.name}」`)}else P.target=g.choice||actionableIds(S,P,1)[0]||'road';P.routes.add(P.target);P.choiceHistory.push({t:E.tick,target:P.target});S.c.actions++;log(S,`${P.name} 행동 선택: ${places[P.target]?.n||P.target}`)}
function outcome(S,P,id){const M=MODELS[S.key],before=sig(evalP(S,P,1)),first=!P.disc.has(id),r=rewardFor(S,P,id),st=stateKey(S);if(M.fb){P.disc.add(id);P.vis[id]=(P.vis[id]||0)+1;S.c.exp++}if(M.kind==='oasis'&&M.fb){for(const[n,p]of npcs.filter(n=>n[1]===id)){P.seenNPC.add(n);if(M.rel){P.relationHistory.push({t:E.tick,npc:n,place:p});S.c.rel++}}refreshHidden(S,P)}if(M.kind==='q'&&M.fb){const key=st+'|'+id,old=P.q[key]??0;P.q[key]=old+.22*(r-old)}if(M.kind==='retrieval'&&M.fb)P.memory.push({id,d:S.danger,r});const after=sig(evalP(S,P,1)),totalChanged=M.fb&&changedSig(before,after);if(totalChanged){S.spiral++;S.c.decision++;S.c.experienceSpiral++;S.c.expTransition++;log(S,`${P.name}: 결과가 다음 판단구조 변경 → 총나선 +1`)}if(M.kind==='oasis'&&M.rel){const noRel=sig(evalP(S,P,0)),cand=after.cands!==noRel.cands,part=after.leader!==noRel.leader,choice=after.choice!==noRel.choice;if(cand){S.c.structuralExpansion++;log(S,`${P.name}: 관계가 후보구조 확장`)}if(part){S.c.participationTransition++;log(S,`${P.name}: 관계가 참여구조 변경`)}if(choice){S.c.choiceTransition++;P.pendingRelChoice=after.choice;log(S,`${P.name}: 관계가 실제 선택 변경`)}if(P.pendingRelChoice===id&&totalChanged){S.c.relationSpiral++;P.pendingRelChoice=null;log(S,`${P.name}: 관계기인 선택 결과가 다음 판단 변경 → 관계나선 +1`)}}if(first&&M.fb)log(S,`${P.name}: ${places[id].n} 첫 경험`)}
function move(m,x,y,s){let dx=x-m.x,dy=y-m.y,l=Math.hypot(dx,dy)||1;m.x+=dx/l*Math.min(s,l);m.y+=dy/l*Math.min(s,l)}function tickW(S,e){const b=S.danger;S.danger=clamp(S.danger+e.pulse,0,1);if(b!==S.danger)S.c.flow++;for(const P of S.parties){const d=places[P.target]||places.road,c=center(P);for(let i=0;i<4;i++)move(P.members[i],d.x+off[i][0],d.y+off[i][1],1.55);if(Math.hypot(d.x-c.x,d.y-c.y)<24){outcome(S,P,P.target);choose(S,P)}}}function tick(n=1){while(n--){E.tick++;const e=env(E.tick);for(const S of Object.values(E.worlds))tickW(S,e)}render()}
function visibleKeys(){return Object.keys(MODELS).filter(k=>MODELS[k].group==='both'||MODELS[k].group===labMode)}function ensureFocus(){const ks=visibleKeys();if(!ks.includes(focus))focus='full'}
function replay(){const S=E.worlds[focus],P=S.parties.find(x=>x.id===focusParty);if(MODELS[focus].kind==='oasis'){const a=sig(evalP(S,P,1)),b=sig(evalP(S,P,0));log(S,`${P.name} 관계 제거 재시험: 포함=${a.choice||'없음'} / 제거=${b.choice||'없음'} / ${changedSig(a,b)?'차이 있음':'동일'}`)}else{const a=sig(evalP(S,P,1));log(S,`${P.name} 동일상황 재시험: ${MODELS[focus].n} 선택=${a.choice||'없음'}`)}render()}
function draw(){const S=E.worlds[focus],P=S.parties.find(x=>x.id===focusParty);ctx.clearRect(0,0,960,600);ctx.fillStyle='#10271f';ctx.fillRect(0,0,960,600);const avail=MODELS[focus].kind==='oasis'?availableOasis(S,P,1):publicPlaces();for(const[id,d]of Object.entries(places)){ctx.fillStyle=avail.includes(id)?'#8dd3c7':'#52616b';ctx.beginPath();ctx.arc(d.x,d.y,8,0,7);ctx.fill();ctx.fillStyle='#ddd';ctx.font='12px sans-serif';ctx.fillText(d.n,d.x+11,d.y+4)}const cols=['#e88b72','#77c9b8','#9d91d8'];S.parties.forEach((p,i)=>{p.members.forEach(m=>{ctx.fillStyle=cols[i];ctx.beginPath();ctx.arc(m.x,m.y,5,0,7);ctx.fill()});const c=center(p);ctx.fillStyle='#fff';ctx.fillText(p.name,c.x+8,c.y-10)})}
function render(){ensureFocus();const keys=visibleKeys(),S=E.worlds[focus],P=S.parties.find(x=>x.id===focusParty);$('subtitle').textContent=labMode==='ablation'?'내부 절제실험: OASIS의 특정 축을 제거하여 구조 기여를 확인합니다. 이 군들은 기존 모델을 대표하지 않습니다.':'외부 비교실험: OASIS는 OASIS 구조로만 구현하고, 비교군은 규칙 기반·효용 기반·보상학습·검색기억형의 전형적 작동방식을 각각 독립적으로 구현합니다. 특정 상용 모델의 정확한 복제품은 아닙니다.';$('footer').textContent=labMode==='ablation'?'절제군은 OASIS 내부 원인분해용입니다. 외부 성능 비교의 근거로 사용하지 않습니다.':'비교군은 OASIS를 일부러 약화한 군이 아니라 각 접근의 자기 논리로 행동합니다. 비교 대상은 단순 우승 횟수가 아니라 변화가 만들어지는 구조와 경로입니다.';$('tabAbl').classList.toggle('on',labMode==='ablation');$('tabExt').classList.toggle('on',labMode==='external');$('compareTitle').textContent=labMode==='ablation'?'내부 절제 비교':'기존모델 참고 비교';$('focus').innerHTML=keys.map(k=>`<option value="${k}" ${k===focus?'selected':''}>${MODELS[k].n}</option>`).join('');$('day').textContent=Math.floor(E.tick/144+1)+'일';$('danger').textContent=S.danger<.3?'낮음':S.danger<.6?'중간':'높음';$('relations').textContent=P.relationHistory.length;$('candidate').textContent=S.c.cand;$('decision').textContent=S.c.decision;$('spiral').textContent=S.spiral;$('hidden').textContent=P.hiddenCandidates.size;$('stories').textContent=P.hiddenDone.size;$('compare').innerHTML=keys.map(k=>{const w=E.worlds[k];return`<div class="wc ${k===focus?'on':''}" data-k="${k}"><h3>${MODELS[k].n}</h3><div class="tag">${MODELS[k].desc}</div><div class="mini">행동 <b>${w.c.actions}</b> · 총나선 <b>${w.spiral}</b><br>경험나선 <b>${w.c.experienceSpiral}</b> · 관계나선 <b>${w.c.relationSpiral}</b><br>후보변화 <b>${w.c.cand}</b> · 흐름 <b>${w.c.flow}</b></div></div>`}).join('');document.querySelectorAll('.wc').forEach(x=>x.onclick=()=>{focus=x.dataset.k;render()});$('metrics').innerHTML='<tr><th>군</th><th>행동</th><th>총나선</th><th>경험나선</th><th>관계나선</th><th>확장</th><th>참여전이</th><th>선택전이</th><th>경험</th><th>흐름</th></tr>'+keys.map(k=>{const w=E.worlds[k];return`<tr><td>${MODELS[k].n}</td><td>${w.c.actions}</td><td>${w.spiral}</td><td>${w.c.experienceSpiral}</td><td>${w.c.relationSpiral}</td><td>${w.c.structuralExpansion}</td><td>${w.c.participationTransition}</td><td>${w.c.choiceTransition}</td><td>${w.c.exp}</td><td>${w.c.flow}</td></tr>`}).join('');const hs=hiddenDefs.map(h=>`${h.name}: ${P.hiddenDone.has(h.id)?'발생':P.hiddenCandidates.has(h.id)?'현재 후보':'관계과정 미완성'}`).join('<br>');$('explain').innerHTML=`<b>${P.name}</b> → ${places[P.target]?.n||P.target}<br>모델: ${MODELS[focus].n} · ${MODELS[focus].desc}<br>현재 위치: ${places[currentPlace(P)].n}${MODELS[focus].kind==='oasis'?`<br>현재 참여: ${[...participants(S,P,1)].join(', ')}<br><span class="hidden">히든 스토리</span><br>${hs}`:''}`;$('log').innerHTML=S.events.slice(0,35).map(e=>`<div>[${e.t}] ${e.s}</div>`).join('');draw()}
$('focusParty').innerHTML=defs.map(d=>`<option value="${d[0]}">${d[1]}</option>`).join('');$('focus').onchange=e=>{focus=e.target.value;render()};$('focusParty').onchange=e=>{focusParty=e.target.value;render()};$('tabAbl').onclick=()=>{labMode='ablation';focus='full';render()};$('tabExt').onclick=()=>{labMode='external';focus='full';render()};$('toggle').onclick=()=>{E.paused=!E.paused;$('toggle').textContent=E.paused?'재생':'일시정지'};$('step').onclick=()=>tick();$('run100').onclick=()=>tick(100);$('replay').onclick=replay;$('reset').onclick=reset;$('speed').onchange=start;
function reset(){E={tick:0,paused:0,worlds:{}};for(const k in MODELS){E.worlds[k]=mkW(k);log(E.worlds[k],MODELS[k].n+' 시작')}for(const S of Object.values(E.worlds))for(const P of S.parties)choose(S,P);render()}function start(){clearInterval(timer);timer=setInterval(()=>{if(!E.paused)tick()},+$('speed').value)}if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');reset();start();
</script></body></html>
