<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OASIS MVP2</title></head><body><div id="boot">OASIS MVP2 불러오는 중…</div><script>(async()=>{try{const r=await fetch("https://raw.githubusercontent.com/ChoJuneSeop/oasis-mvp1/e4c02b2b22fcda0de153e3ff277ff41f1ee0bbdf/index.html",{cache:'no-store'});if(!r.ok)throw new Error(r.status);let h=await r.text();const p='<scr'+'ipt>'+"(function(){\nconst oldMkP=mkP,oldMkW=mkW,oldRender=render;\nmkP=function(d){const p=oldMkP(d);p.possibilityPaths={};return p};\nmkW=function(k){const s=oldMkW(k);Object.assign(s.c,{pathGenerated:0,pathCandidate:0,pathSelected:0,pathRealized:0,pathChanged:0});return s};\nfunction gatedForNPC(n){return Object.entries(places).filter(([_,d])=>d.gate===n).map(([id])=>id)}\nfunction pathSource(S){const k=MODELS[S.key].kind;return k==='oasis'?'관계과정':k==='rule'?'규칙':k==='utility'?'효용':k==='q'?'Q학습':k==='retrieval'?'검색기억':'기타'}\nfunction openPath(S,P,n,id){if(!id||P.possibilityPaths[id])return;P.possibilityPaths[id]={npc:n,source:pathSource(S),generated:E.tick,candidate:null,selected:null,realized:null,changed:null};S.c.pathGenerated++;log(S,`${P.name}: [가능성경로] 발견 ${n} → 생성 ${places[id].n} (${pathSource(S)})`)}\nfunction markCandidates(S,P,g){const cs=new Set((g.cands||'').split(',').filter(Boolean));for(const[id,x]of Object.entries(P.possibilityPaths))if(x.candidate==null&&cs.has(id)){x.candidate=E.tick;S.c.pathCandidate++;log(S,`${P.name}: [가능성경로] 후보참여 ${places[id].n}`)}}\nchoose=function(S,P){if(MODELS[S.key].kind==='oasis')refreshHidden(S,P);const g=sig(evalP(S,P,1));markCandidates(S,P,g);if(P.last&&P.last!==g.cands)S.c.cand++;if(P.leader&&P.leader!==g.leader)S.c.part++;P.last=g.cands;P.leader=g.leader;if(g.choice?.startsWith('hidden:')&&MODELS[S.key].rel){const h=hiddenDefs.find(x=>x.id===g.choice.slice(7));P.hiddenDone.add(h.id);P.hiddenCandidates.delete(h.id);P.target=h.places[h.places.length-1];log(S,`${P.name}: 히든 스토리 선택 ★ 「${h.name}」`)}else P.target=g.choice||actionableIds(S,P,1)[0]||'road';P.routes.add(P.target);const px=P.possibilityPaths[P.target];if(px&&px.selected==null){px.selected=E.tick;S.c.pathSelected++;log(S,`${P.name}: [가능성경로] 실제선택 ${places[P.target].n}`)}P.choiceHistory.push({t:E.tick,target:P.target});S.c.actions++;log(S,`${P.name} 행동 선택: ${places[P.target]?.n||P.target}`)};\noutcome=function(S,P,id){const M=MODELS[S.key],before=sig(evalP(S,P,1)),first=!P.disc.has(id),r=rewardFor(S,P,id),st=stateKey(S),metNPCs=npcs.filter(n=>n[1]===id);for(const[n]of metNPCs){const fresh=!P.seenNPC.has(n);P.seenNPC.add(n);if(fresh&&M.kind!=='static')for(const gid of gatedForNPC(n))openPath(S,P,n,gid)}if(M.fb){P.disc.add(id);P.vis[id]=(P.vis[id]||0)+1;S.c.exp++}if(M.kind==='oasis'&&M.fb){for(const[n,p]of metNPCs)if(M.rel){P.relationHistory.push({t:E.tick,npc:n,place:p});S.c.rel++}refreshHidden(S,P)}if(M.kind==='q'&&M.fb){const key=st+'|'+id,old=P.q[key]??0;P.q[key]=old+.22*(r-old)}if(M.kind==='retrieval'&&M.fb)P.memory.push({id,d:S.danger,r});const after=sig(evalP(S,P,1)),totalChanged=M.fb&&changedSig(before,after);markCandidates(S,P,after);const px=P.possibilityPaths[id];if(px&&px.selected!=null&&px.realized==null){px.realized=E.tick;S.c.pathRealized++;log(S,`${P.name}: [가능성경로] 결과도달 ${places[id].n}`)}if(px&&px.realized!=null&&px.changed==null&&totalChanged){px.changed=E.tick;S.c.pathChanged++;log(S,`${P.name}: [가능성경로] 후속변화 ${places[id].n} → 다음 판단 변경`)}if(totalChanged){S.spiral++;S.c.decision++;S.c.experienceSpiral++;S.c.expTransition++;log(S,`${P.name}: 결과가 다음 판단구조 변경 → 총나선 +1`)}if(M.kind==='oasis'&&M.rel){const noRel=sig(evalP(S,P,0)),cand=after.cands!==noRel.cands,part=after.leader!==noRel.leader,choice=after.choice!==noRel.choice;if(cand){S.c.structuralExpansion++;log(S,`${P.name}: 관계가 후보구조 확장`)}if(part){S.c.participationTransition++;log(S,`${P.name}: 관계가 참여구조 변경`)}if(choice){S.c.choiceTransition++;P.pendingRelChoice=after.choice;log(S,`${P.name}: 관계가 실제 선택 변경`)}if(P.pendingRelChoice===id&&totalChanged){S.c.relationSpiral++;P.pendingRelChoice=null;log(S,`${P.name}: 관계기인 선택 결과가 다음 판단 변경 → 관계나선 +1`)}}if(first&&M.fb)log(S,`${P.name}: ${places[id].n} 첫 경험`)};\nfunction ensurePanel(){if(document.getElementById('pathCard'))return;const sec=document.createElement('section');sec.className='card';sec.id='pathCard';sec.innerHTML='<h2>가능성 경로 추적</h2><div class=\"note\" id=\"pathSummary\"></div><div style=\"overflow:auto\"><table class=\"table\" id=\"pathMetrics\"></table></div>';document.querySelector('.right').appendChild(sec)}\nrender=function(){oldRender();ensurePanel();const keys=visibleKeys(),S=E.worlds[focus],P=S.parties.find(x=>x.id===focusParty);document.getElementById('pathMetrics').innerHTML='<tr><th>군</th><th>생성</th><th>후보</th><th>선택</th><th>도달</th><th>후속</th></tr>'+keys.map(k=>{const c=E.worlds[k].c;return `<tr><td>${MODELS[k].n}</td><td>${c.pathGenerated||0}</td><td>${c.pathCandidate||0}</td><td>${c.pathSelected||0}</td><td>${c.pathRealized||0}</td><td>${c.pathChanged||0}</td></tr>`}).join('');const rows=Object.entries(P.possibilityPaths||{}).map(([id,x])=>`${places[id].n}: 발견✓ → 생성✓ → 후보${x.candidate!=null?'✓':'·'} → 선택${x.selected!=null?'✓':'·'} → 도달${x.realized!=null?'✓':'·'} → 후속${x.changed!=null?'✓':'·'} [${x.source}]`);document.getElementById('pathSummary').innerHTML=`<b>${P.name} · ${MODELS[focus].n}</b><br>${rows.join('<br>')||'아직 생성된 확장 가능성 없음'}`};\n})();"+'</scr'+'ipt>';h=h.replace('</body>',p+'</body>');document.open();document.write(h);document.close();await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='./relation-field.js';s.onload=resolve;s.onerror=()=>reject(new Error('relation-field.js load failed'));document.body.appendChild(s)})}catch(e){const b=document.getElementById('boot');if(b)b.textContent='OASIS MVP2 로딩 실패: '+e}})();</script></body></html>
